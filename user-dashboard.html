<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            padding: 50px 0;
            background: #000;
            min-height: 90vh;
            color: #fff;
        }

        .user-profile-card {
            background: #111;
            border: 1px solid #eba10e;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #eba10e;
            margin-bottom: 20px;
        }

        .order-history {
            background: #111;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand-logo">
                <img src="images.png" alt="Gymshark Logo" class="logo">
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="user-dashboard.html">My Dashboard</a></li>
                </ul>
                <div class="auth-links"></div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="user-profile-card">
                        <img src="https://via.placeholder.com/120" alt="Profile" class="profile-img">
                        <h2 id="u-name">Member Name</h2>
                        <p class="text-warning fw-bold">VISIONARY STATUS</p>
                        <p class="text-muted" id="u-email">email@example.com</p>
                        <button class="btn btn-outline-warning btn-sm mt-3">Edit Profile</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="order-history">
                        <h3>Order History</h3>
                        <div class="text-center py-5">
                            <p class="text-muted">You haven't placed any orders yet.</p>
                            <a href="products.html" class="btn btn-warning fw-bold">START SHOPPING</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (user) {
                document.getElementById('u-name').innerText = user.name;
                document.getElementById('u-email').innerText = user.email;
            }
        });
    </script>
</body>

</html>
