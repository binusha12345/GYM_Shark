<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            padding: 50px 0;
            background: #000;
            min-height: 90vh;
            color: #fff;
        }

        .user-profile-card {
            background: #111;
            border: 1px solid #eba10e;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #eba10e;
            margin-bottom: 20px;
        }

        .order-history {
            background: #111;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <div class="navbar-brand-creative">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="#eba10e" stroke-width="4" fill="#1a1a1a" />
          <path d="M24 12L32 36H16L24 12Z" fill="#eba10e" />
        </svg>
        <span class="navbar-title">GYMSHARK FITNESS</span>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="services.html" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Services
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="online-coaching.html">Online Coaching</a></li>
              <li><a class="dropdown-item" href="nutrition-plans.html">Nutrition Plans</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item" href="workout-plans.html">Workout Plans</a></li>
              <li><a class="dropdown-item" href="one-month-plan.html">1 Month Plan</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>

        <form class="d-flex mx-3" role="search" id="search-form" action="products.html" method="GET">
          <input class="form-control" type="search" name="q" placeholder="Search products..." aria-label="Search" />
          <button class="btn btn-primary" type="submit">Search</button>
        </form>

        <div class="d-flex align-items-center auth-links">
          <a href="login.html" class="nav-link text-white">Login</a>
          <a href="register.html" class="btn btn-outline-warning btn-sm">Join Us</a>
        </div>

        <div class="d-flex align-items-center ms-3">
          <a href="wishlist.html" class="nav-link position-relative me-3 text-white">
            ❤️ <span id="wishlist-count"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
              style="font-size: 0.7rem; display: none;">0</span>
          </a>
          <a href="cart.html" class="nav-link position-relative text-white">
            👜 <span id="cart-count"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
              style="font-size: 0.7rem; display: none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="nav-controls">
    <button class="nav-ctrl-btn" onclick="window.history.back()" title="Back">❮</button>
    <button class="nav-ctrl-btn" onclick="window.history.forward()" title="Forward">❯</button>
  </div>


    <div class="dashboard-container">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="user-profile-card">
                        <img src="https://via.placeholder.com/120" alt="Profile" class="profile-img">
                        <h2 id="u-name">Member Name</h2>
                        <p class="text-warning fw-bold">VISIONARY STATUS</p>
                        <p class="text-muted" id="u-email">email@example.com</p>
                        <button class="btn btn-outline-warning btn-sm mt-3">Edit Profile</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="order-history">
                        <h3>Order History</h3>
                        <div class="text-center py-5">
                            <p class="text-muted">You haven't placed any orders yet.</p>
                            <a href="products.html" class="btn btn-warning fw-bold">START SHOPPING</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (user) {
                document.getElementById('u-name').innerText = user.name;
                document.getElementById('u-email').innerText = user.email;
            }
        });
    </script>
</body>

</html>
