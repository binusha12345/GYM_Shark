<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .auth-card {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #eba10e;
            width: 100%;
            max-width: 400px;
            color: #fff;
        }

        .auth-card h2 {
            color: #eba10e;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            background: #222;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            background: #333;
            border-color: #eba10e;
            color: #fff;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand-logo">
                <img src="images.png" alt="Gymshark Logo" class="logo">
            </a>
            <a class="navbar-brand text-white" href="index.html">Gymshark</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>LOGIN</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">LOGIN</button>
                <div class="text-center mt-3">
                    <p class="small text-muted">Don't have an account? <a href="register.html"
                            class="text-warning">Register</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (Auth.login(email, password)) {
                const user = Auth.getCurrentUser();
                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } else {
                alert('Invalid email or password');
            }
        });
    </script>
</body>

</html>
