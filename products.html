<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-section {
            padding: 20px 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 70px;
            z-index: 100;
        }

        .collection-grid {
            padding: 40px 0;
        }

        .no-results {
            text-align: center;
            padding: 100px 0;
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <img src="images.png" alt="Gymshark Logo" class="logo">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><b>Gymshark</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="services.html" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="online-coaching.html">Online Coaching</a></li>
                            <li><a class="dropdown-item" href="nutrition-plans.html">Nutrition Plans</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="workout-plans.html">Workout Plans</a></li>
                            <li><a class="dropdown-item" href="one-month-plan.html">1 Month Plan</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                </ul>
                <form class="d-flex" id="nav-search-form" action="products.html" method="GET">
                    <input class="form-control me-2" type="search" id="nav-search-input" name="q"
                        placeholder="Search products..." aria-label="Search">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div class="d-flex ms-3 align-items-center">
                    <a href="wishlist.html" class="nav-link position-relative me-3">
                        ❤️ <span id="wishlist-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                    <a href="cart.html" class="nav-link position-relative">
                        👜 <span id="cart-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="filter-section">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h2 id="collection-title">All Products</h2>
                <div class="btn-group">
                    <button class="btn btn-outline-dark filter-btn active" data-filter="all">All</button>
                    <button class="btn btn-outline-dark filter-btn" data-filter="women">Women</button>
                    <button class="btn btn-outline-dark filter-btn" data-filter="men">Men</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container collection-grid">
        <div class="row product-grid" id="product-container">
            <!-- Products will be injected here -->
        </div>
        <div class="no-results" id="no-results">
            <h3>No products found Match your search.</h3>
            <p>Try different keywords or filters.</p>
        </div>
    </div>

    <footer class="footer mt-5">
        <div class="footer-bottom text-center p-3">
            <p>&copy; 2026 Gymshark Official.</p>
        </div>
    </footer>

    <script src="js/collection.js"></script>
    <script src="js/store.js"></script>
</body>

</html>
