<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag - Gymshark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            padding: 80px 0;
        }

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            display: flex;
            align-items: center;
        }

        .cart-item img {
            width: 100px;
            border-radius: 8px;
            margin-right: 20px;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .summary-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg ">
        <img src="images.png" alt="Gymshark Logo" class="logo">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><b>Gymshark</b></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                </ul>
                <div class="d-flex ms-3 align-items-center">
                    <a href="wishlist.html" class="nav-link position-relative me-3">
                        ❤️ <span id="wishlist-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container cart-container">
        <h1 class="mb-5">YOUR BAG</h1>
        <div class="row">
            <div class="col-md-8">
                <div id="cart-items">
                    <!-- Items injected here -->
                    <div class="text-center py-5" id="empty-cart-msg">
                        <h3>Your bag is empty</h3>
                        <a href="products.html" class="btn btn-dark mt-3">SHOP PRODUCTS</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <h3>Summary</h3>
                    <div class="d-flex justify-content-between mt-4">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mt-2">
                        <span>Estimated Delivery</span>
                        <span>FREE</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <strong>Total</strong>
                        <strong id="cart-total" class="fs-4">$0.00</strong>
                    </div>
                    <button class="btn btn-dark w-100 btn-lg mt-4">CHECKOUT</button>
                    <p class="text-muted small mt-3">Free returns on all orders within 30 days.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const itemsContainer = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');
            const emptyMsg = document.getElementById('empty-cart-msg');

            function renderCart() {
                const items = Store.cart;
                if (items.length === 0) {
                    itemsContainer.innerHTML = '';
                    itemsContainer.appendChild(emptyMsg);
                    emptyMsg.style.display = 'block';
                    subtotalEl.innerText = '$0.00';
                    totalEl.innerText = '$0.00';
                    return;
                }

                emptyMsg.style.display = 'none';
                itemsContainer.innerHTML = '';
                let subtotal = 0;

                items.forEach(item => {
                    const price = item.price || 0;
                    subtotal += price * (item.quantity || 1);
                    const html = `
                        <div class="cart-item">
                            <img src="${item.image}" alt="${item.title}">
                            <div class="cart-item-info">
                                <h5>${item.title}</h5>
                                <p class="text-muted small">${item.type || ''} | ${item.color || ''}</p>
                                <div class="d-flex align-items-center mt-2">
                                    <button class="btn btn-sm btn-outline-dark me-2" onclick="adjustQty('${item.id}', -1)">-</button>
                                    <span>${item.quantity || 1}</span>
                                    <button class="btn btn-sm btn-outline-dark ms-2" onclick="adjustQty('${item.id}', 1)">+</button>
                                </div>
                            </div>
                            <div class="text-end">
                                <p class="fw-bold">$${(price * (item.quantity || 1)).toFixed(2)}</p>
                                <button class="btn btn-link text-danger p-0" onclick="removeItem('${item.id}')">Remove</button>
                            </div>
                        </div>
                    `;
                    itemsContainer.insertAdjacentHTML('beforeend', html);
                });

                subtotalEl.innerText = `$${subtotal.toFixed(2)}`;
                totalEl.innerText = `$${subtotal.toFixed(2)}`;
            }

            window.adjustQty = (id, delta) => {
                const item = Store.cart.find(i => i.id === id);
                if (item) {
                    item.quantity = Math.max(1, (item.quantity || 1) + delta);
                    Store.save();
                    renderCart();
                }
            };

            window.removeItem = (id) => {
                Store.removeFromCart(id);
                renderCart();
            };

            renderCart();
        });
    </script>
</body>

</html>
