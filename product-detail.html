<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Gymshark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            padding: 50px 0;
            background: #f9f9f9;
        }

        .product-main-image img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .product-info-section {
            padding: 20px;
        }

        .price-tag {
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            margin: 20px 0;
        }

        .specs-table {
            margin-top: 30px;
        }

        .specs-table th {
            width: 30%;
            color: #666;
        }

        .buy-now-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            transition: all 0.3s;
        }

        .buy-now-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .breadcrumb {
            background: transparent;
            padding: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <img src="images.png" alt="Gymshark Logo" class="logo">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><b>Gymshark</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="services.html" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="online-coaching.html">Online Coaching</a></li>
                            <li><a class="dropdown-item" href="nutrition-plans.html">Nutrition Plans</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="workout-plans.html">Workout Plans</a></li>
                            <li><a class="dropdown-item" href="one-month-plan.html">1 Month Plan</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                </ul>
                <form class="d-flex" role="search" action="products.html" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div class="d-flex ms-3 align-items-center">
                    <a href="wishlist.html" class="nav-link position-relative me-3">
                        ❤️ <span id="wishlist-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                    <a href="cart.html" class="nav-link position-relative">
                        👜 <span id="cart-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container product-detail-container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active" id="breadcrumb-category">Category</li>
                <li class="breadcrumb-item active" aria-current="page" id="breadcrumb-title">Product</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-md-6">
                <div class="product-main-image">
                    <img id="product-img" src="" alt="Product Image">
                </div>
            </div>
            <div class="col-md-6">
                <div class="product-info-section">
                    <h1 id="product-title">Loading...</h1>
                    <p class="text-muted" id="product-type"></p>
                    <div class="rating mb-3" id="product-rating">
                        <!-- Stars will be injected here -->
                    </div>
                    <div class="price-tag" id="product-price"></div>
                    <p class="description" id="product-description"></p>

                    <div class="specs-table">
                        <h3>Specifications</h3>
                        <table class="table">
                            <tbody id="product-specs">
                                <!-- Specs will be injected here -->
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-4">
                        <button class="btn btn-dark btn-lg buy-now-btn">ADD TO BAG</button>
                        <button class="btn btn-outline-dark btn-lg buy-now-btn ms-2">WISHLIST</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 p-5 bg-dark text-white">
        <div class="container text-center">
            <div class="footer-nav mb-4">
                <a href="index.html" class="text-white mx-2 text-decoration-none">Home</a>
                <a href="products.html" class="text-white mx-2 text-decoration-none">Products</a>
                <a href="services.html" class="text-white mx-2 text-decoration-none">Services</a>
                <a href="wishlist.html" class="text-white mx-2 text-decoration-none">Wishlist</a>
                <a href="cart.html" class="text-white mx-2 text-decoration-none">Bag</a>
            </div>
            <p>&copy; 2026 Gymshark Official. Be a visionary.</p>
        </div>
    </footer>

    <script src="js/product-detail.js"></script>
    <script src="js/store.js"></script>
</body>

</html>
