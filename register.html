    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .auth-card {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #eba10e;
            width: 100%;
            max-width: 400px;
            color: #fff;
        }

        .auth-card h2 {
            color: #eba10e;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            background: #222;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            background: #333;
            border-color: #eba10e;
            color: #fff;
            box-shadow: none;
        }
    </style>
</head>

<body>

        </svg>
        <span class="navbar-title">GYMSHARK FITNESS</span>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="services.html" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Services
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="online-coaching.html">Online Coaching</a></li>
              <li><a class="dropdown-item" href="nutrition-plans.html">Nutrition Plans</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item" href="workout-plans.html">Workout Plans</a></li>
              <li><a class="dropdown-item" href="one-month-plan.html">1 Month Plan</a></li>

          </li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>

        <form class="d-flex mx-3" role="search" id="search-form" action="products.html" method="GET">
          <input class="form-control" type="search" name="q" placeholder="Search products..." aria-label="Search" />
          <button class="btn btn-primary" type="submit">Search</button>
        </form>

        <div class="d-flex align-items-center auth-links">
          <a href="login.html" class="nav-link text-white">Login</a>
          <a href="register.html" class="btn btn-outline-warning btn-sm">Join Us</a>

        <div class="d-flex align-items-center ms-3">
          <a href="wishlist.html" class="nav-link position-relative me-3 text-white">
            ❤️ <span id="wishlist-count"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill"

          <a href="cart.html" class="nav-link position-relative text-white">
            👜 <span id="cart-count"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
              style="font-size: 0.7rem; display: none;">0</span>

        </div>
      </div>

  </nav>

  <div class="nav-controls">
    <button class="nav-ctrl-btn" onclick="window.history.back()" title="Back">❮</button>
    <button class="nav-ctrl-btn" onclick="window.history.forward()" title="Forward">❯</button>
  </div>


    <div class="auth-container">
        <div class="auth-card">
            <h2>REGISTER</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 mt-3 text-black fw-bold">CREATE ACCOUNT</button>
                <div class="text-center mt-3">
                    <p class="small text-muted">Already have an account? <a href="login.html"
                            class="text-warning">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            if (Auth.register(userData)) {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } else {
                alert('Email already registered');
            }
        });
    </script>
</body>

</html>
