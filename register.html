<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .auth-card {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #eba10e;
            width: 100%;
            max-width: 400px;
            color: #fff;
        }

        .auth-card h2 {
            color: #eba10e;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            background: #222;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus {
            background: #333;
            border-color: #eba10e;
            color: #fff;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand-logo">
                <img src="images.png" alt="Gymshark Logo" class="logo">
            </a>
            <a class="navbar-brand text-white" href="index.html">Gymshark</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>REGISTER</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 mt-3 text-black fw-bold">CREATE ACCOUNT</button>
                <div class="text-center mt-3">
                    <p class="small text-muted">Already have an account? <a href="login.html"
                            class="text-warning">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            if (Auth.register(userData)) {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } else {
                alert('Email already registered');
            }
        });
    </script>
</body>

</html>
