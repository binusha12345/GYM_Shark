<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Gymshark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .wishlist-container {
            padding: 80px 0;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .empty-wishlist {
            text-align: center;
            padding: 100px 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg ">
        <a href="index.html" class="navbar-brand-logo">
            <img src="images.png" alt="Gymshark Logo" class="logo">
        </a>
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><b>Gymshark</b></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                </ul>
                <div class="d-flex ms-3 align-items-center">
                    <a href="cart.html" class="nav-link position-relative">
                        👜 <span id="cart-count"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                            style="font-size: 0.6rem; display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="nav-controls">
        <button class="nav-ctrl-btn" onclick="window.history.back()" title="Back">❮</button>
        <button class="nav-ctrl-btn" onclick="window.history.forward()" title="Forward">❯</button>
    </div>

    <div class="container wishlist-container">
        <h1 class="mb-5">YOUR WISHLIST</h1>
        <div id="wishlist-grid" class="wishlist-grid">
            <!-- Items injected here -->
        </div>
        <div id="empty-state" class="empty-wishlist" style="display: none;">
            <h3>Nothing here yet.</h3>
            <p>Save your favorite items here while you shop.</p>
            <a href="products.html" class="btn btn-dark mt-3">SHOP NOW</a>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('wishlist-grid');
            const emptyState = document.getElementById('empty-state');

            function renderWishlist() {
                const items = Store.wishlist;
                if (items.length === 0) {
                    grid.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';
                grid.innerHTML = '';
                items.forEach(item => {
                    const html = `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${item.image}" alt="${item.title}" onclick="window.open('product-detail.html?id=${item.id}', '_blank')">
                                <button class="favorite-btn active" onclick="removeFromWishlist('${item.id}')">❤️</button>
                            </div>
                            <div class="product-info">
                                <h3>${item.title}</h3>
                                <p class="product-price">$${item.price.toFixed(2)}</p>
                                <button class="btn btn-dark w-100 mt-2" title="Add to Bag" onclick="addToBag('${item.id}')">ADD TO BAG</button>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', html);
                });
            }

            window.removeFromWishlist = (id) => {
                const item = Store.wishlist.find(i => i.id === id);
                if (item) {
                    Store.toggleWishlist(item);
                    renderWishlist();
                }
            };

            window.addToBag = (id) => {
                const item = Store.wishlist.find(i => i.id === id);
                if (item) {
                    Store.addToCart(item);
                }
            };

            renderWishlist();
        });
    </script>
</body>

</html>
