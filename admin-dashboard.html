<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gymshark Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            padding: 50px 0;
            background: #000;
            min-height: 90vh;
            color: #fff;
        }

        .admin-card {
            background: #111;
            border: 1px solid #eba10e;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .admin-card h3 {
            color: #eba10e;
            margin-bottom: 25px;
        }

        .form-control,
        .form-select {
            background: #222;
            border: 1px solid #333;
            color: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            background: #333;
            border-color: #eba10e;
            color: #fff;
            box-shadow: none;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        .stat-val {
            font-size: 2rem;
            font-weight: bold;
            color: #eba10e;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand-logo">
                <img src="images.png" alt="Gymshark Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="services.html" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="online-coaching.html">Online Coaching</a></li>
                            <li><a class="dropdown-item" href="nutrition-plans.html">Nutrition Plans</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="workout-plans.html">Workout Plans</a></li>
                            <li><a class="dropdown-item" href="one-month-plan.html">1 Month Plan</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link active" href="admin-dashboard.html">Admin Panel</a></li>
                </ul>
                <form class="d-flex mx-3" role="search" action="products.html" method="GET">
                    <input class="form-control" type="search" name="q" placeholder="Search products..." aria-label="Search" />
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div class="d-flex align-items-center auth-links ms-3">
                    <a href="index.html" class="btn btn-outline-warning btn-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <h1 class="mb-5">Admin Dashboard</h1>

            <div class="row mb-5">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-label">Total Products</div>
                        <div class="stat-val" id="count-products">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-label">Total Users</div>
                        <div class="stat-val" id="count-users">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-label">Active Sales</div>
                        <div class="stat-val">$12,450</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-label">New Orders</div>
                        <div class="stat-val">24</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-5">
                    <div class="admin-card">
                        <h3>Add New Product</h3>
                        <form id="addProductForm">
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" id="p-title" class="form-control" required
                                    placeholder="Product Title">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">Category</label>
                                    <select id="p-category" class="form-select">
                                        <option value="men">Men</option>
                                        <option value="women">Women</option>
                                        <option value="accessories">Accessories</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="form-label">Price ($)</label>
                                    <input type="number" id="p-price" class="form-control" step="0.01" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Image Filename</label>
                                <input type="text" id="p-image" class="form-control" required placeholder="short1.webp">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea id="p-desc" class="form-control" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">PUBLISH PRODUCT</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="admin-card">
                        <h3>Inventory Management</h3>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Title</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-product-list">
                                    <!-- List items here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Security check
        if (!Auth.isAdmin()) {
            window.location.href = 'login.html';
        }

        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newProduct = {
                id: 'custom-' + Date.now(),
                title: document.getElementById('p-title').value,
                category: document.getElementById('p-category').value,
                price: parseFloat(document.getElementById('p-price').value),
                image: document.getElementById('p-image').value,
                description: document.getElementById('p-desc').value,
                rating: 5
            };

            // Using localStorage for demo purposes since we can't write to JSON file easily from client
            const localProducts = JSON.parse(localStorage.getItem('gymshark_custom_products')) || [];
            localProducts.push(newProduct);
            localStorage.setItem('gymshark_custom_products', JSON.stringify(localProducts));

            alert('Product added successfully!');
            location.reload();
        });

        // Initialize dashboard stats
        document.addEventListener('DOMContentLoaded', () => {
            const users = JSON.parse(localStorage.getItem('gymshark_users')) || [];
            document.getElementById('count-users').innerText = users.length;

            // Mock product list
            const customProducts = JSON.parse(localStorage.getItem('gymshark_custom_products')) || [];
            document.getElementById('count-products').innerText = 12 + customProducts.length;

            const list = document.getElementById('admin-product-list');
            customProducts.forEach(p => {
                list.innerHTML += `
                    <tr>
                        <td>${p.id.substring(0, 8)}</td>
                        <td>${p.title}</td>
                        <td>$${p.price.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger">Delete</button></td>
                    </tr>
                `;
            });
        });
    </script>
</body>

</html>
